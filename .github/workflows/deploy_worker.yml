# Deploy the Hexo site to Cloudflare Workers as static assets.
#
# ⚠️  SETUP REQUIRED before this workflow can succeed:
#   1. Add a repo secret `CLOUDFLARE_WORKERS_API_TOKEN` — a Cloudflare API token
#      with Workers Scripts (edit) on the Hezum account, plus Zone → DNS (edit)
#      on samhamilton.co.uk so the custom_domain route in wrangler.jsonc can
#      provision its DNS record.
#   2. ONE-TIME CUTOVER: delete the existing proxied record for
#      www.samhamilton.co.uk in the samhamilton.co.uk zone. Cloudflare refuses
#      to attach a Worker custom domain to a hostname that already has an
#      externally managed A/CNAME record:
#        "Hostname 'www.samhamilton.co.uk' already has externally managed DNS
#         records (A, CNAME, etc). Delete them first" [code: 100117]
#      The deploy still uploads the script and assets when this fails — it just
#      leaves the Worker unrouted — so the fix is to delete the record and
#      re-run. Once the custom domain exists, later deploys reuse it and this
#      never comes up again.
#
# Single production environment: one wrangler.jsonc, one Worker, one hostname.
# For a staging split, add an `env.staging` block to wrangler.jsonc and pass
# `--env staging` here rather than swapping config files.
#
# The build runs in this job rather than in wrangler-action's `command` because
# `wrangler deploy` uploads whatever is already in public/ — it does not build.
# A deploy step that ran without the build ahead of it would happily ship an
# empty asset directory and take the site down.
name: Deploy Worker

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: "24"

permissions:
  contents: read

# Two pushes to main must not race to upload different builds to the same
# Worker. Not cancel-in-progress: a half-finished deploy should be allowed to
# land rather than be killed part-way.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      # public/ is gitignored, so it exists only because of the step above. If
      # the build silently produced nothing, uploading it would replace the live
      # site with an empty one — so refuse to deploy rather than find out later.
      - name: Verify build output
        run: |
          set -euo pipefail
          test -f public/index.html
          test -f public/404.html
          test -f public/sitemap.xml
          echo "public/: $(find public -type f | wc -l) files"

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_WORKERS_API_TOKEN }}
          accountId: "f09251021fc7ffc5de334cc5a29bebc0"
